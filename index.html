<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB MENU DIGITAL</title>

<style>
html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
}

header {
  background: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
}

.categorias {
  display: flex;
  gap: 8px;
  padding: 10px;
  overflow-x: auto;
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 10;
}

.categorias button {
  padding: 8px 12px;
  border: none;
  border-radius: 20px;
  background: #eee;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
}

.categorias button.ativo {
  background: #d32f2f;
  color: white;
}

.container {
  padding: 15px;
}

.categoria {
  margin-top: 20px;
}

.produto {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  overflow: hidden;
}

.produto img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.info {
  padding: 10px;
}

.qtd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}

.qtd button {
  width: 30px;
  height: 30px;
  font-size: 18px;
  background: #ddd;
  border: none;
  border-radius: 5px;
}

button.add {
  background: #d32f2f;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
}

.carrinho {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 30px;
}

.carrinho ul {
  list-style: none;
  padding: 0;
}

.carrinho li {
  background: #f9f9f9;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 5px;
}

.controls button {
  padding: 4px 8px;
}

.remove {
  background: #ff5252;
  color: white;
  border: none;
}

.total-box {
  margin-top: 10px;
  padding: 10px;
  background: #e8f5e9;
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
}

.finalizar {
  width: 100%;
  padding: 12px;
  background: green;
  color: white;
  font-size: 16px;
  border: none;
  border-radius: 5px;
}

/* 🔥 BOTÃO FLUTUANTE DO CARRINHO */
#cart-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #d32f2f;
  color: white;
  padding: 12px 16px;
  border-radius: 50px;
  display: none;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  cursor: pointer;
  z-index: 100;
}

#cart-count {
  background: white;
  color: #d32f2f;
  border-radius: 50%;
  padding: 2px 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>HAMBURGUERIA ORIGINAL BURGUER</h1>
  <p>
    Faça seu pedido online <br>
    Horário: 18h às 23h <br>
    Escolha os produtos, adicione ao carrinho <br>
    e envie direto pelo WhatsApp
  </p>
</header>

<div class="categorias">
  <button class="ativo" onclick="scrollToCategoria('hamburgueres', this)">🍔 Hambúrgueres</button>
  <button onclick="scrollToCategoria('batatas', this)">🍟 Batatas</button>
  <button onclick="scrollToCategoria('massas', this)">🍝 Massas</button>
  <button onclick="scrollToCategoria('bebidas', this)">🥤 Bebidas</button>
</div>

<div class="container">

<!-- TODAS AS SUAS CATEGORIAS E PRODUTOS MANTIDOS 100% IGUAIS -->
<!-- (SEU CONTEÚDO CONTINUA EXATAMENTE COMO VOCÊ ENVIOU) -->

<!-- ... SEU HTML DE PRODUTOS PERMANECE AQUI SEM ALTERAÇÃO ... -->

<div class="carrinho" id="carrinho">
<h3>Carrinho</h3>
<ul id="lista"></ul>
<div class="total-box">Total: R$ <span id="total">0</span></div>
</div>

<h3>Seus dados</h3>
<input id="nome" placeholder="Nome">
<input id="rua" placeholder="Rua">
<input id="numero" placeholder="Número">
<input id="bairro" placeholder="Bairro">
<input id="comp" placeholder="Complemento">

<textarea id="obs" placeholder="Observações do pedido (ex: X-Burger sem cebola, batata bem passada)"></textarea>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Cartão</option>
</select>

<button class="finalizar" onclick="enviar()">Enviar pedido no WhatsApp</button>

</div>

<!-- 🔥 BOTÃO FLUTUANTE -->
<div id="cart-float" onclick="document.getElementById('carrinho').scrollIntoView({behavior:'smooth'})">
🛒 Carrinho <span id="cart-count">0</span>
</div>

<script>
let carrinho = {};
let quantidades = {};
let total = 0;

function scrollToCategoria(id, btn){
document.getElementById(id).scrollIntoView({behavior:'smooth'});
document.querySelectorAll('.categorias button').forEach(b=>b.classList.remove('ativo'));
btn.classList.add('ativo');
}

function atualizarCarrinhoFloat(){
let count = Object.values(carrinho).reduce((s,i)=>s+i.qtd,0);
let cart = document.getElementById("cart-float");
document.getElementById("cart-count").innerText = count;
cart.style.display = count > 0 ? "flex" : "none";
}

function aumentar(nome){
quantidades[nome]=(quantidades[nome]||1)+1;
document.getElementById("qtd-"+nome).innerText=quantidades[nome];
}

function diminuir(nome){
if((quantidades[nome]||1)>1){
quantidades[nome]--;
document.getElementById("qtd-"+nome).innerText=quantidades[nome];
}
}

function addComQtd(nome,preco){
let qtd=quantidades[nome]||1;
if(!carrinho[nome]) carrinho[nome]={preco,qtd};
else carrinho[nome].qtd+=qtd;
quantidades[nome]=1;
document.getElementById("qtd-"+nome).innerText=1;
render();
}

function render(){
let lista=document.getElementById("lista");
lista.innerHTML="";
total=0;
for(let i in carrinho){
let sub=carrinho[i].preco*carrinho[i].qtd;
total+=sub;
lista.innerHTML+=`
<li>
<strong>${i}</strong> - ${carrinho[i].qtd}x (R$ ${sub})
<div class="controls">
<button onclick="alterarQtd('${i}',-1)">−</button>
<button onclick="alterarQtd('${i}',1)">+</button>
<button class="remove" onclick="delete carrinho['${i}'];render()">🗑️</button>
</div>
</li>`;
}
document.getElementById("total").innerText=total;
atualizarCarrinhoFloat();
}

function alterarQtd(nome,delta){
carrinho[nome].qtd+=delta;
if(carrinho[nome].qtd<=0) delete carrinho[nome];
render();
}

function enviar(){
let msg=`🍔 *NOVO PEDIDO*\n\n`;
msg+=`👤 Nome: ${nome.value}\n`;
msg+=`📍 Endereço: ${rua.value}, ${numero.value} - ${bairro.value}\n`;
msg+=`📦 Complemento: ${comp.value}\n`;
msg+=`💳 Pagamento: ${pagamento.value}\n`;
msg+=`📝 Observações: ${obs.value||"Nenhuma"}\n\n🛒 *Pedido:*\n`;
for(let i in carrinho){msg+=`• ${i} (${carrinho[i].qtd}x)\n`;}
msg+=`\n💰 *Total: R$ ${total}*`;
window.open("https://wa.me/5534999060948?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
